# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  # Approve when all findings are resolved, request changes while some are open.
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!docs/package-lock.json"
    - "!Cargo.lock"
    - "!tools/release-version/Cargo.lock"
