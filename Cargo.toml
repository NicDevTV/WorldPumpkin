[package]
name = "world-pumpkin"
version = "0.1.0-dev.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"
description = "A small world plugin for Pumpkin Minecraft servers."

[lib]
crate-type = ["cdylib"]

[dependencies]
semver = "1.0.28"
pumpkin-plugin-api = { version = "0.2.2", git = "https://github.com/Pumpkin-MC/Pumpkin", rev = "10f1fde9367c827f168eaabdc8f343b1ce6f676c", package = "pumpkin-plugin-api" }
serde_json = "1.0.151"
waki = "0.5.1"

[build-dependencies]
semver = "1.0.28"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
