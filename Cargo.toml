[package]
name = "world-pumpkin"
version = "0.0.2"
edition = "2021"
license = "MIT"
description = "A small world plugin for Pumpkin Minecraft servers."

[lib]
crate-type = ["cdylib"]

[dependencies]
pumpkin-plugin-api = { version = "0.1.0", git = "https://github.com/Pumpkin-MC/Pumpkin", rev = "0800ed8878cef0461ed3955de204e1ff2c532a4e", package = "pumpkin-plugin-api" }
serde_json = "1.0"
waki = "0.5.1"

[build-dependencies]
pumpkin-data = { git = "https://github.com/Pumpkin-MC/Pumpkin", rev = "0800ed8878cef0461ed3955de204e1ff2c532a4e", package = "pumpkin-data", default-features = false, features = ["block", "tag"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
