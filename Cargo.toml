[package]
name = "world-pumpkin"
version = "0.0.2"
edition = "2021"
license = "MIT"
description = "A small world plugin for Pumpkin Minecraft servers."

[lib]
crate-type = ["cdylib"]

[dependencies]
pumpkin-plugin-api = { version = "0.1.0", git = "https://github.com/Pumpkin-MC/Pumpkin", rev = "e480f322653b69e32b90e735e4703e0b827aa981", package = "pumpkin-plugin-api" }
serde_json = "1.0"
waki = "0.5.1"

[build-dependencies]
pumpkin-data = { git = "https://github.com/Pumpkin-MC/Pumpkin", rev = "e480f322653b69e32b90e735e4703e0b827aa981", package = "pumpkin-data", default-features = false, features = ["block", "tag"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
