name: Build Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0 or v0.2.0-rc.1"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  PLUGIN_WASM: target/wasm32-wasip2/release/world_pumpkin.wasm
  ASSET_NAME: world_pumpkin.wasm
  RELEASE_TAG: ${{ inputs.tag }}
  WORLDPUMPKIN_RELEASE_BUILD: "true"

permissions:
  contents: write

jobs:
  build:
    name: Build Draft Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout WorldPumpkin
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-wasip2 --component rustfmt --component clippy
          rustup default stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.2

      - name: Set version from release tag
        run: cargo run --quiet --locked --manifest-path tools/release-version/Cargo.toml --target-dir target -- "$RELEASE_TAG"

      - name: Test release version tooling
        run: cargo test --locked --manifest-path tools/release-version/Cargo.toml --target-dir target

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Test
        run: cargo test --locked --lib

      - name: Lint
        run: cargo clippy --locked --target wasm32-wasip2 --all-targets -- -D warnings

      - name: Check Wasm build
        run: cargo check --locked --target wasm32-wasip2

      - name: Build release Wasm
        run: cargo build --locked --release --target wasm32-wasip2

      - name: Create release bundle
        run: |
          mkdir -p dist
          cp "$PLUGIN_WASM" "dist/$ASSET_NAME"

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=false
          if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then
            prerelease=true
          fi
          if existing=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [[ "$existing" != "true" ]]; then
              echo "Release $RELEASE_TAG is already published. Use a new tag."
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA" --prerelease="$prerelease"
            gh release upload "$RELEASE_TAG" "dist/$ASSET_NAME" --clobber
          else
            extra_flags=()
            if [[ "$prerelease" == "true" ]]; then
              extra_flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "WorldPumpkin $RELEASE_TAG" \
              --notes "Draft release for WorldPumpkin $RELEASE_TAG." \
              "${extra_flags[@]}" \
              "dist/$ASSET_NAME"
          fi
