name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
  pull_request:
    paths-ignore:
      - "docs/**"

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout WorldPumpkin
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-wasip2 --component rustfmt --component clippy
          rustup default stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Test
        run: cargo test --locked --lib

      - name: Check release version tooling
        run: |
          cargo fmt --manifest-path tools/release-version/Cargo.toml -- --check
          cargo test --locked --manifest-path tools/release-version/Cargo.toml --target-dir target
          cargo clippy --locked --manifest-path tools/release-version/Cargo.toml --target-dir target -- -D warnings

      - name: Lint
        run: cargo clippy --locked --target wasm32-wasip2 --all-targets -- -D warnings

      - name: Check Wasm build
        run: cargo check --locked --target wasm32-wasip2

      - name: Build release Wasm
        run: cargo build --locked --release --target wasm32-wasip2

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: world-pumpkin-wasm
          path: target/wasm32-wasip2/release/world_pumpkin.wasm
          if-no-files-found: error
          retention-days: 3
