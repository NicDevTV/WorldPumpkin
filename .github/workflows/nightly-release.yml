name: Nightly Build

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  PLUGIN_WASM: target/wasm32-wasip2/release/world_pumpkin.wasm
  ASSET_NAME: world_pumpkin-nightly.wasm

permissions:
  contents: write

concurrency:
  group: nightly-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check if nightly is up to date
        id: nightly
        run: |
          CURRENT_SHA="$(git rev-parse HEAD)"

          if git ls-remote --tags origin nightly | grep -q .; then
            git fetch origin tag nightly
            NIGHTLY_SHA="$(git rev-parse nightly)"

            echo "Current: $CURRENT_SHA"
            echo "Nightly: $NIGHTLY_SHA"

            if [ "$CURRENT_SHA" = "$NIGHTLY_SHA" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        if: steps.nightly.outputs.changed == 'true'
        run: |
          rustup toolchain install nightly \
            --profile minimal \
            --target wasm32-wasip2 \
            --component rustfmt \
            --component clippy
          rustup default nightly

      - name: Cache Cargo
        if: steps.nightly.outputs.changed == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: steps.nightly.outputs.changed == 'true'
        run: cargo fmt --all --check

      - name: Lint
        if: steps.nightly.outputs.changed == 'true'
        run: cargo clippy --locked --target wasm32-wasip2 --all-targets -- -D warnings

      - name: Check build
        if: steps.nightly.outputs.changed == 'true'
        run: cargo check --locked --target wasm32-wasip2

      - name: Build
        if: steps.nightly.outputs.changed == 'true'
        run: cargo build --locked --release --target wasm32-wasip2

      - name: Prepare artifact
        if: steps.nightly.outputs.changed == 'true'
        run: |
          mkdir -p dist
          cp "$PLUGIN_WASM" "dist/$ASSET_NAME"

      - name: Recreate nightly tag
        if: steps.nightly.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          gh release delete nightly -y || true

          git tag -d nightly 2>/dev/null || true
          git push origin :refs/tags/nightly || true

          git tag nightly
          git push origin nightly

      - name: Create nightly release
        if: steps.nightly.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(cat <<EOF
          Commit: $(git rev-parse HEAD)
          Generated: $(date -u '+%Y-%m-%d %H:%M UTC')
          EOF
          )

          gh release create nightly \
            "dist/$ASSET_NAME" \
            --title "Nightly Build" \
            --notes "$NOTES" \
            --prerelease \
            --latest=false
