name: Nightly Build

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  PLUGIN_WASM: target/wasm32-wasip2/release/world_pumpkin.wasm
  ASSET_NAME: world_pumpkin-nightly.wasm

permissions:
  contents: write

concurrency:
  group: nightly-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust
        run: |
          rustup toolchain install nightly \
            --profile minimal \
            --target wasm32-wasip2 \
            --component rustfmt \
            --component clippy
          rustup default nightly

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --locked --target wasm32-wasip2 --all-targets -- -D warnings

      - name: Check build
        run: cargo check --locked --target wasm32-wasip2

      - name: Build
        run: cargo build --locked --release --target wasm32-wasip2

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp "$PLUGIN_WASM" "dist/$ASSET_NAME"

      - name: Create unique tag
        run: |
          TAG="nightly-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Create release (FIXED NOTES)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf "Commit: %s\nGenerated: %s\n" \
            "$(git rev-parse HEAD)" \
            "$(date -u '+%Y-%m-%d %H:%M UTC')" > notes.txt

          gh release create "$TAG" \
            "dist/$ASSET_NAME" \
            --title "Nightly Build $TAG" \
            --notes-file notes.txt \
            --prerelease \
            --latest=false
