name: Nightly Build

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  PLUGIN_WASM: target/wasm32-wasip2/release/world_pumpkin.wasm
  ASSET_NAME: world_pumpkin.wasm

permissions:
  contents: write

concurrency:
  group: nightly-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check if build is needed
        id: check
        run: |
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        if: steps.check.outputs.changed == 'true'
        run: |
          rustup toolchain install nightly \
            --profile minimal \
            --target wasm32-wasip2 \
            --component rustfmt \
            --component clippy
          rustup default nightly

      - name: Cache Cargo
        if: steps.check.outputs.changed == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: steps.check.outputs.changed == 'true'
        run: cargo fmt --all --check

      - name: Lint
        if: steps.check.outputs.changed == 'true'
        run: cargo clippy --locked --target wasm32-wasip2 --all-targets -- -D warnings

      - name: Check build
        if: steps.check.outputs.changed == 'true'
        run: cargo check --locked --target wasm32-wasip2

      - name: Build
        if: steps.check.outputs.changed == 'true'
        run: cargo build --locked --release --target wasm32-wasip2

      - name: Prepare artifact
        if: steps.check.outputs.changed == 'true'
        run: |
          mkdir -p dist
          cp "$PLUGIN_WASM" "dist/$ASSET_NAME"

      - name: Create unique tag
        if: steps.check.outputs.changed == 'true'
        run: |
          TAG="nightly-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"

          echo "TAG=$TAG" >> $GITHUB_ENV

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$TAG"
          git push origin "$TAG"

      - name: Create release
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            "dist/$ASSET_NAME" \
            --title "Nightly Build $TAG" \
            --notes "Commit: $(git rev-parse HEAD)
Generated: $(date -u '+%Y-%m-%d %H:%M UTC')" \
            --prerelease \
            --latest=false
